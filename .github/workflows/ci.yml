# Repo-wide checks on every contribution: secret scan over the full history, formatting, tooling tests, fresh code map.
# Lint, tests and build of the server, web and mobile clients are added as jobs once the stack is chosen (docs/plan/).
# Third-party actions are pinned by commit SHA (a repository setting requires it); Dependabot bumps them.
name: CI

on:
  push:
    # main only: its run triggers the Epitech mirror. dev changes only through pull requests, already checked
    # (up to date with dev before merging), so a push run on dev would repeat the pull_request run.
    branches: [main]
  pull_request:
    # edited: the title check reruns when the title changes. Once long stack jobs exist, move that check to its own
    # workflow on edited and keep this one on opened, synchronize, reopened.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # manual run (Actions tab or `gh workflow run CI --ref <branch>`)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Secrets, format, tooling tests, code map
    # The mirror copies this file into the Epitech repository, where Actions cannot start (no minutes): skipped
    # there, not failed. Excludes that organization rather than naming this repository: a rename must not turn
    # the required check into a silent skip (GitHub counts a skipped required check as passed).
    if: github.repository_owner != 'EpitechPGE3-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false # no step pushes: keeps the token away from npm install scripts

      # The squash or merge commit takes the PR title (repository setting), and GitHub runs no hook there: the same
      # check as the local commit-msg hook. The title goes through an env var, never inline, so it cannot inject shell.
      # Accepted limit: this step and the next one run the pull request's own copy of this file and of the hook, so a
      # pull request could weaken them. They catch mistakes, not attacks: an approval is required, and any change to
      # this file or to .husky/ shows in the diff. Moving them to pull_request_target would also change the required check.
      - name: Pull request title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            "Merge "* | "fixup! "* | "squash! "* | "amend! "*)
              echo "::error::A pull request title cannot start like a merge, fixup!, squash! or amend! commit."
              exit 1 ;;
          esac
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          sh .husky/commit-msg "$RUNNER_TEMP/pr-title"

      # A pull request merged with a merge commit keeps its own commits: their messages get the same check. Merge commits
      # and Dependabot's own commits ("Bump ...", from a security update merged into main, then back into dev) are left out.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On its own line, so a failing rev-list stops the step instead of checking nothing.
          shas=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          status=0
          for sha in $shas; do
            [ "$(git log -1 --format=%an "$sha")" = "dependabot[bot]" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            # The hook lets these through for local work; once in a pull request they must be squashed or renamed.
            case "$subject" in
              "Merge "* | "fixup! "* | "squash! "* | "amend! "*)
                echo "::error::commit $sha: \"$subject\" must be squashed or renamed before merging"; status=1; continue ;;
            esac
            printf '%s\n' "$subject" > "$RUNNER_TEMP/commit-msg"
            sh .husky/commit-msg "$RUNNER_TEMP/commit-msg" || { echo "::error::commit $sha"; status=1; }
          done
          exit "$status"

      # GitHub proposes main, the default branch, for every new pull request: only release PRs from dev, and Dependabot
      # security updates (they always target main), may go there. Changing the base reruns this (edited event).
      - name: Pull request into main comes from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$HEAD_REPO:$HEAD_REF" in
            "$GITHUB_REPOSITORY:dev" | "$GITHUB_REPOSITORY:dependabot/"*) ;;
            *)
              echo "::error::Pull requests into main come from dev (releases) or Dependabot only: change the base to dev."
              exit 1 ;;
          esac

      # Installs every tool pinned in mise.toml (Node, gitleaks, actionlint, shellcheck): same versions as local.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # The gitleaks binary, not gitleaks-action: the action requires a license key on organization repos.
      - name: Secret scan (gitleaks)
        run: gitleaks git --redact --no-banner --verbose

      - name: Workflow lint (actionlint)
        run: actionlint

      # actionlint only checks the shell inside workflows; the git hooks are shell scripts too, every tracked one.
      - name: Git hooks lint (shellcheck)
        run: git ls-files -z .husky | xargs -0 shellcheck

      # git runs .husky/<hook> directly: a hook committed without its executable bit (e.g. from Windows) is silently skipped.
      - name: Git hooks are executable
        run: |
          git ls-files -s .husky | awk '$1 != "100755" { print "::error::" $4 " is not executable: git update-index --chmod=+x " $4; bad = 1 } END { exit bad }'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run check

      - name: Code map is up to date
        run: |
          npm run -s codemap
          git diff --exit-code .claude/codemap.md || { echo "::error::.claude/codemap.md is stale: run npm run codemap and commit it."; exit 1; }
